<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- top bar -->
  <rect x="0" y="0" width="760" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="760" y2="52" stroke="#e2e8f0"/>
  <g transform="translate(28,26)">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="0" cy="0" r="1.8" fill="#6366f1"/>
  </g>
  <text x="50" y="31" font-size="15" font-weight="700" fill="#0f172a">InterviewPrep</text>
  <circle cx="722" cy="26" r="13" fill="#6366f1"/>
  <text x="722" y="31" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DU</text>

  <!-- sidebar -->
  <rect x="0" y="52" width="170" height="418" fill="#ffffff"/>
  <line x1="170" y1="52" x2="170" y2="470" stroke="#e2e8f0"/>
  <rect x="16" y="76" width="138" height="34" rx="8" fill="#eef2ff"/>
  <text x="32" y="98" font-size="13" font-weight="600" fill="#6366f1">Dashboard</text>
  <text x="32" y="138" font-size="13" fill="#64748b">Practice</text>
  <text x="32" y="178" font-size="13" fill="#64748b">Analytics</text>
  <text x="32" y="218" font-size="13" fill="#64748b">Resume</text>
  <text x="32" y="258" font-size="13" fill="#64748b">History</text>

  <!-- main title -->
  <text x="190" y="92" font-size="22" font-weight="800" fill="#0f172a">Dashboard</text>

  <!-- stat cards -->
  <g>
    <rect x="190" y="112" width="168" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="206" y="150" font-size="28" font-weight="800" fill="#6366f1">122</text>
    <text x="206" y="176" font-size="12" fill="#64748b">Interviews</text>
  </g>
  <g>
    <rect x="383" y="112" width="168" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="399" y="150" font-size="28" font-weight="800" fill="#a855f7">7.4</text>
    <text x="399" y="176" font-size="12" fill="#64748b">Avg score</text>
  </g>
  <g>
    <rect x="576" y="112" width="168" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="592" y="150" font-size="28" font-weight="800" fill="#22c55e">300</text>
    <text x="592" y="176" font-size="12" fill="#64748b">Questions</text>
  </g>

  <!-- line chart -->
  <rect x="190" y="214" width="356" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="206" y="242" font-size="13" font-weight="600" fill="#334155">Progress over time</text>
  <polyline points="206,404 270,382 334,350 398,368 462,306 530,278 530,404 206,404" fill="url(#area)" stroke="none"/>
  <polyline points="206,404 270,382 334,350 398,368 462,306 530,278" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#6366f1">
    <circle cx="206" cy="404" r="3.5"/><circle cx="270" cy="382" r="3.5"/><circle cx="334" cy="350" r="3.5"/>
    <circle cx="398" cy="368" r="3.5"/><circle cx="462" cy="306" r="3.5"/><circle cx="530" cy="278" r="3.5"/>
  </g>

  <!-- bar chart -->
  <rect x="562" y="214" width="182" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="578" y="242" font-size="13" font-weight="600" fill="#334155">By category</text>
  <g>
    <rect x="582" y="350" width="18" height="54" rx="3" fill="#6366f1"/>
    <rect x="609" y="320" width="18" height="84" rx="3" fill="#a855f7"/>
    <rect x="636" y="360" width="18" height="44" rx="3" fill="#6366f1"/>
    <rect x="663" y="296" width="18" height="108" rx="3" fill="#a855f7"/>
    <rect x="690" y="336" width="18" height="68" rx="3" fill="#6366f1"/>
    <rect x="717" y="278" width="18" height="126" rx="3" fill="#a855f7"/>
  </g>
</svg>
