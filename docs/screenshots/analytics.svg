<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="28" y="46" font-size="22" font-weight="800" fill="#0f172a">Analytics</text>

  <!-- weak area callout -->
  <rect x="24" y="64" width="712" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="56" cy="94" r="14" fill="#ef4444"/>
  <text x="56" y="99" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">!</text>
  <text x="84" y="90" font-size="14" font-weight="700" fill="#b91c1c">Your weakest area: DBMS (avg 5.2)</text>
  <text x="84" y="110" font-size="13" fill="#dc2626">Focus your next few sessions here to lift your overall score.</text>

  <!-- horizontal bar chart card -->
  <rect x="24" y="140" width="440" height="296" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="168" font-size="14" font-weight="600" fill="#334155">Average score by category</text>
  <g font-size="12" fill="#64748b">
    <text x="44" y="204">Arrays</text>
    <rect x="150" y="194" width="272" height="14" rx="7" fill="#6366f1"/>
    <text x="44" y="240">System Design</text>
    <rect x="150" y="230" width="226" height="14" rx="7" fill="#6366f1"/>
    <text x="44" y="276">OS</text>
    <rect x="150" y="266" width="190" height="14" rx="7" fill="#6366f1"/>
    <text x="44" y="312">DSA</text>
    <rect x="150" y="302" width="158" height="14" rx="7" fill="#6366f1"/>
    <text x="44" y="348">DBMS</text>
    <rect x="150" y="338" width="108" height="14" rx="7" fill="#ef4444"/>
    <text x="44" y="384">Networking</text>
    <rect x="150" y="374" width="186" height="14" rx="7" fill="#6366f1"/>
  </g>

  <!-- donut card -->
  <rect x="480" y="140" width="256" height="296" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="500" y="168" font-size="14" font-weight="600" fill="#334155">Score distribution</text>
  <g transform="translate(608,258)">
    <circle r="60" fill="none" stroke="#22c55e" stroke-width="26" stroke-dasharray="151 226" transform="rotate(-90)"/>
    <circle r="60" fill="none" stroke="#6366f1" stroke-width="26" stroke-dasharray="132 245" stroke-dashoffset="-151" transform="rotate(-90)"/>
    <circle r="60" fill="none" stroke="#f59e0b" stroke-width="26" stroke-dasharray="94 283" stroke-dashoffset="-283" transform="rotate(-90)"/>
  </g>
  <g font-size="12" fill="#64748b">
    <rect x="516" y="392" width="12" height="12" rx="3" fill="#22c55e"/>
    <text x="534" y="402">High (8-10)</text>
    <rect x="636" y="392" width="12" height="12" rx="3" fill="#6366f1"/>
    <text x="654" y="402">Mid (5-7)</text>
    <rect x="516" y="414" width="12" height="12" rx="3" fill="#f59e0b"/>
    <text x="534" y="424">Low (0-4)</text>
  </g>
</svg>
