<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- decorative circles -->
  <circle cx="1080" cy="60" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="1140" cy="300" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="960" cy="330" r="60" fill="#ffffff" opacity="0.05"/>

  <!-- target logo -->
  <g transform="translate(120,132)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
  </g>

  <!-- title -->
  <text x="210" y="120" font-size="52" font-weight="800" fill="#ffffff">Smart Interview</text>
  <text x="210" y="182" font-size="52" font-weight="800" fill="#ffffff">Preparation Platform</text>

  <!-- tagline -->
  <text x="212" y="228" font-size="21" font-weight="500" fill="#e0e7ff">AI-graded mock interviews &#183; resume-based questions &#183; analytics</text>

  <!-- badge pills -->
  <g font-size="16" font-weight="600" fill="#ffffff">
    <g>
      <rect x="210" y="266" width="80" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
      <rect x="210" y="266" width="80" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="250" y="288" text-anchor="middle">React</text>
    </g>
    <g>
      <rect x="300" y="266" width="90" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
      <rect x="300" y="266" width="90" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="345" y="288" text-anchor="middle">Node.js</text>
    </g>
    <g>
      <rect x="400" y="266" width="104" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
      <rect x="400" y="266" width="104" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="452" y="288" text-anchor="middle">MongoDB</text>
    </g>
    <g>
      <rect x="514" y="266" width="94" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
      <rect x="514" y="266" width="94" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="561" y="288" text-anchor="middle">Express</text>
    </g>
    <g>
      <rect x="618" y="266" width="106" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
      <rect x="618" y="266" width="106" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="671" y="288" text-anchor="middle">Gemini AI</text>
    </g>
    <g>
      <rect x="734" y="266" width="88" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
      <rect x="734" y="266" width="88" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="778" y="288" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
